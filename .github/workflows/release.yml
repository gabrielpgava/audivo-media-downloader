name: Release smoke builds

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            platform: windows/amd64
          - name: macos-arm64
            runner: macos-14
            platform: darwin/arm64
          - name: macos-amd64
            runner: macos-13
            platform: darwin/amd64
          - name: linux-x64
            runner: ubuntu-latest
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Install Linux Wails dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - run: "$(go env GOPATH)/bin/wails generate module"
      - run: "$(go env GOPATH)/bin/wails build -clean -platform ${{ matrix.platform }}"
      - uses: actions/upload-artifact@v4
        with:
          name: audivo-${{ matrix.name }}
          path: build/bin
          if-no-files-found: error
